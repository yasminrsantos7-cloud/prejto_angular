<header class="header">
  <button class="menu-toggle-btn" id="menuToggleBtn" aria-label="Abrir Menu">
    <span class="menu-icon" aria-hidden="true">☰</span>
  </button>

  <nav class="sidebar-nav" id="sidebarNav">
    <div class="brand-logo">
      <img src="/img/ford.png" alt="Logo Ford">
    </div>

    <ul>
      <li>
        <a routerLink="/home"><i></i>home</a>
      </li>
      <li>
        <a routerLink="/dashboard"><i></i>Dashboard</a>
      </li>
      <li>
        <button type="button" class="menu-link logout-link" routerLink="/login" (click)="fecharMenu()">
          <i class="fa-solid fa-square-arrow-up-right" aria-hidden="true"></i>
           <span>Sair</span>
        </button>
      </li>
    </ul>
  </nav>

  <div class="menu-overlay" id="menuOverlay"></div>
</header>

<main class="home-main">
  <div class="login-image-container">
    <div
      class="car-image"
      role="img"
      aria-label="Ford Ranger">
    </div>
  </div>

  <div class="squares-container">
    <div class="square-panel">
      <div class="panel-header">
        sistema de dados da ford
      </div>

      <div class="panel-content">
       seja bem vindo (a)!
      </div>
    </div>
  </div>
</main>
